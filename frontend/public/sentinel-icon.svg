<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="#7C3AED"/>
  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="white" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#grid)"/>
  <!-- Shield -->
  <g transform="translate(156, 80)">
    <path d="M100 10L190 50V120C190 170 150 210 100 220C50 210 10 170 10 120V50L100 10Z" fill="white" fill-opacity="0.15" stroke="white" stroke-width="4"/>
    <path d="M100 30L170 60V120C170 160 140 190 100 200C60 190 30 160 30 120V60L100 30Z" fill="white" fill-opacity="0.1"/>
    <!-- Checkmark -->
    <path d="M60 115L88 145L145 80" stroke="white" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Chain links at bottom -->
  <g transform="translate(156, 340)">
    <circle cx="40" cy="20" r="12" stroke="white" stroke-width="3" fill="none" opacity="0.4"/>
    <circle cx="75" cy="20" r="12" stroke="white" stroke-width="3" fill="none" opacity="0.4"/>
    <circle cx="110" cy="20" r="12" stroke="white" stroke-width="3" fill="none" opacity="0.4"/>
    <circle cx="145" cy="20" r="12" stroke="white" stroke-width="3" fill="none" opacity="0.4"/>
    <circle cx="160" cy="20" r="12" stroke="white" stroke-width="3" fill="none" opacity="0.4"/>
    <!-- Links between circles -->
    <line x1="52" y1="20" x2="63" y2="20" stroke="white" stroke-width="3" opacity="0.3"/>
    <line x1="87" y1="20" x2="98" y2="20" stroke="white" stroke-width="3" opacity="0.3"/>
    <line x1="122" y1="20" x2="133" y2="20" stroke="white" stroke-width="3" opacity="0.3"/>
  </g>
  <!-- Text -->
  <text x="256" y="430" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="700" fill="white" text-anchor="middle">Sentinel</text>
  <text x="256" y="465" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="400" fill="white" fill-opacity="0.7" text-anchor="middle" letter-spacing="1">AI AGENT GUARDRAILS</text>
</svg>
