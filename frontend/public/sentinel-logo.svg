    <circle cx="50" cy="95" r="4" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
    <circle cx="65" cy="95" r="4" stroke="white" stroke-width="2" fill="none" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="120" y="72" font-family="Inter, system-ui, sans-serif" font-size="48" font-weight="700" fill="#1E1B4B">Sentinel</text>
  <!-- Tagline -->
  <text x="122" y="95" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="400" fill="#6B7280" letter-spacing="0.5">On-chain guardrails for AI agents</text>
</svg>
